<!DOCTYPE html>
<html>

<head>
  <!-- Load the components script -->
    <script src="/scripts/components.js" defer></script>
  <style>
    .demoClass{
      color: red;
    }
  </style>
</head>

<body>
  <!-- Reusable Header Custom Tag -->
    <main-header></main-header>

  <h1 class="demoClass">8.7 JavaScript can remove existing attributes</h1>
  <h1 class="demoClass">My Heading</h1>

  <button onclick="removeAtt()">Remove color Attribute</button>

  <script>
    function removeAtt(){
      document.getElementsByTagName("h1")[0].removeAttribute("class");
    }
  </script>

  
   <!-- Reusable Footer Custom Tag -->
    <main-footer></main-footer>
</body>

</html>
