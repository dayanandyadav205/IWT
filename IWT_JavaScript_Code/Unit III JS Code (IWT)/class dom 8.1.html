<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>To change HTML Element using JavaScript</h1>

  <p id="p1">My Paragraph</p>

  <button onclick="myFunction()">Click Here</button>

  <script>
    function myFunction(){
      document.getElementById("p1").innerHTML = "Welcome To JS";
    }
  </script>
</body>
</html>
