<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .demoClass{
      color: red;
    }
  </style>
</head>
<body>
  <h1>8.7 JavaScript can remove attributes</h1>

  <h1 class="demoClass">My Heading</h1>

  <button onclick="myFunction()">Remove color attribute</button>

  <script>
    function myFunction(){
      document.getElementsByTagName("h1")[1].removeAttribute("class");
    }
  </script>

</body>
</html>
