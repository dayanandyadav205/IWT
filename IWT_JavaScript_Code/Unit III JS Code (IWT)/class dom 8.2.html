<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Javascript can change HTML Attributes</h1>
  <img src="" alt="" id="img1">

  <button onclick="myFunction()">Click Me</button>

  <script>
    function myFunction(){
      document.getElementById("img1").src = 'img/smily.gif';
    }
  </script>
</body>
</html>
