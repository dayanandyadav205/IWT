<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .form-container {
      padding: 50px;
      background-color: aqua;
      width: 300px;
      height: 300px;
      margin-left: 30%;
    }
  </style>

  <script>
    function showpwd() {
      let x = document.getElementById("pwd");

      if (x.type == "password") {
        x.type = "text";
      }
      else {
        x.type = "password";
      }
    }
  </script>
</head>

<body>

  <div class="form-container">
    <form action="#">

      <input type="password" id="pwd" placeholder="password">
      <input type="checkbox" onclick="showpwd()"><br><br>


      <input type="submit" name="" id="">

    </form>
  </div>
</body>

</html>
