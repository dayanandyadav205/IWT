<!DOCTYPE html>
<html>
<head>
  <!-- Load the components script -->
    <script src="/scripts/components.js" defer></script>
</head>
<head>
  <script>
    function validateForm() {
      let x = document.getElementById("fname").value;
      if (x === "") {
        document.getElementById('alert').innerHTML = "*Name must be filled out";
        return false;
      }
    }
  </script>
</head>

<body>
  <!-- Reusable Header Custom Tag -->
    <main-header></main-header>

  <h2>JavaScript Validation</h2>
  <form action="#" onsubmit="return validateForm()">

    Name: <input type="text" id="fname" pattern="[A-Za-z]+" title="Please enter only alphabets"><br><br>

    <span id="alert" style="color: red;"></span>

    <input type="submit" value="Submit"><br>
  </form>

  
   <!-- Reusable Footer Custom Tag -->
    <main-footer></main-footer>
</body>

</html>
