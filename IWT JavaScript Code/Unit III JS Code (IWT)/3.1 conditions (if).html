<head>

<body>
  <h1>1. JavaScript if</h1>

  <p id="demo1"></p>

  <script>
    let age = 17;
    let text = "You can Not drive!";

    if (age >= 18) {
      text = "You can drive!";
    }

    document.getElementById("demo1").innerHTML = text;
  </script>
