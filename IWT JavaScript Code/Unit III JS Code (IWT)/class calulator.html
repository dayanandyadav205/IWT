<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    function addition(){
      let n1 = parseFloat(document.getElementById("num1").value);
      let n2 = parseFloat(document.getElementById("num2").value);

      let sum = n1 + n2;

      document.getElementById("result").innerHTML = "result =" +sum;
      // document.getElementById("result").innerHTML = Math.round(+sum);

    }
  </script>

</head>
<body>
  <form action="#">

    <input type="text" id="num1" placeholder="Enter First No.">
    <input type="text" id="num2" placeholder="Enter Second no.">

    <button onclick="addition()">+</button>

    <span id="result"></span>
  </form>
</body>
</html>
