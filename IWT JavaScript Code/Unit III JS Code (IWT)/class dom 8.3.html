<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>JavaScript can change CSS of a HTML Element</h1>
  <div id="myDiv">
    <h1 id="h1">My Heading</h1>
  </div>

  <button onclick="myFunction()">Click here</button>

<script>
  function myFunction(){
    document.getElementById("myDiv").style.width = '500px';
    document.getElementById("myDiv").style.height = '500px';
    document.getElementById("myDiv").style.border = '5px solid red';

    document.getElementById("h1").style.fontSize = '50px';
  }
</script>

</body>
</html>
