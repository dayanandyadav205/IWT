<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details</title>
</head>

<body>

  <h1 style="text-align: center;">Book Details</h1>

  <div id='content'>
    <table id='books' cellpadding='10px' border="1">
      <thead>
        <tr>
          <th>Author</th>
          <th>Title</th>
          <th>Genre</th>
          <th>Price</th>
          <th>Publication date</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        <!-- books.xml content will be inserted here -->
      </tbody>
    </table>
  </div>

  <script>
    let xmlContent = '';
    let tableBooks = document.getElementById('books');
    fetch('books.xml').then((response) => {
      response.text().then((xml) => {
        xmlContent = xml;

        let parser = new DOMParser();
        let xmlDOM = parser.parseFromString(xmlContent, 'application/xml');
        let books = xmlDOM.querySelectorAll('book');

        books.forEach(bookXmlNode => {

          let row = document.createElement('tr');

          //author
          let td = document.createElement('td');
          td.innerText = bookXmlNode.children[0].innerHTML;
          row.appendChild(td);

          //  title
          td = document.createElement('td');
          td.innerText = bookXmlNode.children[1].innerHTML;
          row.appendChild(td);

          //  Genre
          td = document.createElement('td');
          td.innerText = bookXmlNode.children[2].innerHTML;
          row.appendChild(td);

          //price
          td = document.createElement('td');
          td.innerText = '$ ' + bookXmlNode.children[3].innerHTML;
          row.appendChild(td);

          //Publication date
          td = document.createElement('td');
          td.innerText = bookXmlNode.children[4].innerHTML;
          row.appendChild(td);

          // Description
          td = document.createElement('td');
          td.innerText = bookXmlNode.children[5].innerHTML;
          row.appendChild(td);

          tableBooks.children[0].appendChild(row);

        });

      });
    });    
  </script>

</body>

</html>
